<canvas id="confetti-canvas"
        style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none"></canvas>
<script>
function lanzarConfeti(ms) {
  const cv = document.getElementById('confetti-canvas');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = 'block';
  const colores = ['#BE8B3C', '#4FB0A6', '#166B6B', '#4E4239', '#D9B26A', '#8FCFC7'];
  const piezas = Array.from({length: 180}, () => ({
    x: Math.random() * cv.width,
    y: -20 - Math.random() * cv.height,
    w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,
    vx: -1.5 + Math.random() * 3, vy: 2 + Math.random() * 4,
    rot: Math.random() * 6.28, vr: -0.2 + Math.random() * 0.4,
    c: colores[Math.floor(Math.random() * colores.length)]
  }));
  const fin = Date.now() + (ms || 4000);
  (function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of piezas) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > cv.height + 20) { p.y = -20; p.x = Math.random() * cv.width; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (Date.now() < fin) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; }
  })();
}
</script>
