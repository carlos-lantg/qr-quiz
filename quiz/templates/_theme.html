<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --bg:#F7F4EE; --surface:#ffffff; --border:#E3DBCB;
    --text:#2E2A26; --muted:#777066;
    --gold:#BE8B3C; --teal:#4FB0A6; --teal-dark:#166B6B; --brown:#4E4239;
  }
  body { background:var(--bg); color:var(--text); }
  /* las utilidades d-flex de Bootstrap usan !important y le ganan a [hidden] */
  [hidden] { display:none !important; }
  /* multiply hace que el fondo blanco del logo desaparezca sobre el crema */
  .logo { display:block; margin:0 auto; mix-blend-mode:multiply; height:clamp(70px,10vh,120px); }
  .surface { background:var(--surface); border:1px solid var(--border); border-radius:.9rem; }
  .text-muted-brand { color:var(--muted) !important; }
  .btn-brand { background:var(--teal-dark); border-color:var(--teal-dark); color:#fff; }
  .btn-brand:hover, .btn-brand:focus { background:#0f5354; border-color:#0f5354; color:#fff; }
  .progress { background:#E8E1D4; }
  .progress-bar { background:var(--teal-dark); }
</style>
